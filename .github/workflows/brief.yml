name: Weekly brief

on:
  schedule:
    # checked every day at 07:47 Malaysia time; a brief is written only when the
    # "days per brief" setting (repository variable BRIEF_EVERY_DAYS, default 7) has passed
    - cron: "47 23 * * *"
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      days:
        description: "How many days to cover"
        required: false
        default: "7"
      check_ai:
        description: "Only test the AI keys (no brief is written)"
        type: boolean
        default: false

permissions:
  contents: read
  models: read               # (GitHub Models was retired in July 2026; harmless)

concurrency:
  group: brief
  cancel-in-progress: false

defaults:
  run:
    working-directory: pao-news-monitor/pao-news-monitor

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write the brief
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # free AI providers, tried in order (add as repository secrets to enable)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DAYS: ${{ github.event.inputs.days || vars.BRIEF_EVERY_DAYS || '7' }}
          # scheduled runs only write a brief when it is due; a manual run always writes one
          EVERY: ${{ github.event_name == 'schedule' && (vars.BRIEF_EVERY_DAYS || '7') || '0' }}
          CHECK_AI: ${{ github.event.inputs.check_ai || 'false' }}
        run: |
          if [ "$CHECK_AI" = "true" ]; then python -m collector.ai; else python -m collector.brief --days "$DAYS" --every "$EVERY"; fi
